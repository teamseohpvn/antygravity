<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Độ xuyên kim mỡ ENEOS Epnoc Grease AP(N) sau 60 và 100.000 lần giã so với dải NLGI</title>
<desc id="d">Theo TDS ENEOS, sau 100.000 lần giã mỗi loại mỡ mềm đi: NLGI 0 từ 362 lên 405, NLGI 1 từ 322 lên 355, NLGI 2 từ 276 lên 327, NLGI 3 từ 232 lên 291 (0,1 mm), tức lùi khoảng một bậc NLGI.</desc>
