<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif">
<title id="t2">Số hạt từ 4 µm tối đa mỗi mL: dầu mới theo DIN 51524 so với yêu cầu của van servo</title>
<desc id="d2">Cận trên số hạt từ 4 µm(c) mỗi mL theo mã ISO 4406: 21 là 20.000, 20 là 10.000, 18 là 2.500, 17 là 1.300, 16 là 640. Dầu mới đạt mức tối thiểu DIN 51524 có thể bẩn gấp khoảng 8 đến 30 lần mức van servo cần.</desc>
<rect width="760" height="400" fill="#fff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#003366">Số hạt ≥ 4 µm(c) tối đa mỗi mL (thang log)</text>
<line x1="365.5" x2="365.5" y1="52" y2="356" stroke="#e2e8f0"/><text x="365.5" y="374" font-size="11" text-anchor="middle" fill="#64748b">500</text>
<line x1="413.7" x2="413.7" y1="52" y2="356" stroke="#e2e8f0"/><text x="413.7" y="374" font-size="11" text-anchor="middle" fill="#64748b">1.000</text>
<line x1="461.8" x2="461.8" y1="52" y2="356" stroke="#e2e8f0"/><text x="461.8" y="374" font-size="11" text-anchor="middle" fill="#64748b">2.000</text>
<line x1="525.5" x2="525.5" y1="52" y2="356" stroke="#e2e8f0"/><text x="525.5" y="374" font-size="11" text-anchor="middle" fill="#64748b">5.000</text>
<line x1="573.7" x2="573.7" y1="52" y2="356" stroke="#e2e8f0"/><text x="573.7" y="374" font-size="11" text-anchor="middle" fill="#64748b">10.000</text>
<line x1="621.8" x2="621.8" y1="52" y2="356" stroke="#e2e8f0"/><text x="621.8" y="374" font-size="11" text-anchor="middle" fill="#64748b">20.000</text>
<text x="320" y="85.0" font-size="12.5" text-anchor="end" fill="#1e293b">Tối thiểu cho dầu mới theo DIN 51524 (21/19/16)</text>
<rect x="330" y="60" width="291.8" height="40" rx="4" fill="#94a3b8"/>
<text x="627.8" y="85.0" font-size="12.5" fill="#1e293b">20.000</text>
<text x="320" y="147.0" font-size="12.5" text-anchor="end" fill="#1e293b">Bosch Rexroth: hệ thủy lực nói chung (20/18/15)</text>
<rect x="330" y="122" width="243.7" height="40" rx="4" fill="#94a3b8"/>
<text x="579.7" y="147.0" font-size="12.5" fill="#1e293b">10.000</text>
<text x="320" y="209.0" font-size="12.5" text-anchor="end" fill="#1e293b">Bosch Rexroth: van servo đặc biệt (18/16/13)</text>
<rect x="330" y="184" width="147.3" height="40" rx="4" fill="#0b5cad"/>
<text x="483.3" y="209.0" font-size="12.5" fill="#1e293b">2.500</text>
<text x="320" y="271.0" font-size="12.5" text-anchor="end" fill="#1e293b">Moog: van servo, mức cơ bản (17/14/11)</text>
<rect x="330" y="246" width="101.9" height="40" rx="4" fill="#0b5cad"/>
<text x="437.9" y="271.0" font-size="12.5" fill="#1e293b">1.300</text>
<text x="320" y="333.0" font-size="12.5" text-anchor="end" fill="#1e293b">Moog: van servo, tuổi thọ dài (16/13/10)</text>
<rect x="330" y="308" width="52.6" height="40" rx="4" fill="#f97316"/>
<text x="388.6" y="333.0" font-size="12.5" fill="#1e293b">640</text>
<text x="20" y="394" font-size="11" fill="#64748b">Nguồn: bảng mã ISO 4406 trong Bosch Rexroth RE 90220/09.18; Moog (07/2015); OELCHECK về DIN 51524.</text>
</svg>