<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Lượng mỡ cho mỗi lần bơm bổ sung theo cỡ vòng bi</title>
  <desc id="d">Tính theo G = 0,005 × D × B: 6205 khoảng 3,9 g, 6308 khoảng 10,4 g, 6310 khoảng 14,9 g, 6312 khoảng 20,2 g, 6316 khoảng 33,2 g.</desc>
