<title id="t">Độ nhớt dầu thủy lực ENEOS Super Hyrando 46 và 68 theo nhiệt độ</title>
<desc id="d">Đường độ nhớt tính từ TDS ENEOS theo ASTM D341. Vùng xanh là khoảng độ nhớt tối ưu 16–36 mm²/s của bơm piston Rexroth A10VSO. Dầu 46 xuống dưới 16 mm²/s ở khoảng 68 °C, dầu 68 ở khoảng 78 °C.</desc>
