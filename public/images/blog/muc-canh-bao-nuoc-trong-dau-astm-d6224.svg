<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Mức nước cảnh báo trong dầu đang dùng theo ASTM D6224</title>
  <desc id="d">Dầu thủy lực và dầu tuabin 500 ppm; dầu bánh răng và dầu tuần hoàn 1.000 ppm; dầu động cơ diesel 2.000 ppm.</desc>
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#0b3d5c">Hàm lượng nước tới mức cảnh báo (ppm)</text>
  <text x="24" y="58" font-size="13" fill="#555">Theo bảng mức cảnh báo ASTM D6224 (bản 2002) cho dầu đang dùng; 10.000 ppm = 1%</text>
  <!-- trục: 0 ppm tại x=240, 2.000 ppm tại x=660 (0,21 px/ppm) -->
  <g font-size="12" fill="#666">
    <line x1="240" y1="80" x2="240" y2="290" stroke="#cbd5e1"/>
    <line x1="345" y1="80" x2="345" y2="290" stroke="#eef1f4"/>
    <line x1="450" y1="80" x2="450" y2="290" stroke="#eef1f4"/>
    <line x1="555" y1="80" x2="555" y2="290" stroke="#eef1f4"/>
    <line x1="660" y1="80" x2="660" y2="290" stroke="#eef1f4"/>
    <text x="240" y="310" text-anchor="middle">0</text>
    <text x="345" y="310" text-anchor="middle">500</text>
    <text x="450" y="310" text-anchor="middle">1.000</text>
    <text x="555" y="310" text-anchor="middle">1.500</text>
    <text x="660" y="310" text-anchor="middle">2.000</text>
  </g>
  <g font-size="14" fill="#1f2937">
    <text x="228" y="108" text-anchor="end">Dầu thủy lực</text>
    <rect x="240" y="92" width="105" height="24" rx="3" fill="#0b3d5c"/>
    <text x="353" y="109" font-weight="700">500 ppm (0,05%)</text>

    <text x="228" y="158" text-anchor="end">Dầu tuabin</text>
    <rect x="240" y="142" width="105" height="24" rx="3" fill="#0b3d5c"/>
    <text x="353" y="159" font-weight="700">500 ppm (0,05%)</text>

    <text x="228" y="208" text-anchor="end">Dầu bánh răng, tuần hoàn</text>
    <rect x="240" y="192" width="210" height="24" rx="3" fill="#2f7ea8"/>
    <text x="458" y="209" font-weight="700">1.000 ppm (0,1%)</text>

    <text x="228" y="258" text-anchor="end">Dầu động cơ diesel</text>
    <rect x="240" y="242" width="420" height="24" rx="3" fill="#4a8fb5"/>
    <text x="650" y="259" font-weight="700" text-anchor="end" fill="#ffffff">2.000 ppm (0,2%)</text>
  </g>
</svg>
