<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Sơ đồ chọn dầu thủy lực có kẽm hay không kẽm</title>
  <desc id="d">Bốn câu hỏi theo thứ tự: tài liệu của hãng máy hoặc hãng bơm ghi gì, máy đang dùng dầu gì, có chi tiết đồng, nước lẫn nhiều hoặc giới hạn kẽm trong nước thải; từ đó ra kết luận dùng dầu có kẽm hoặc không kẽm.</desc>
  <rect width="760" height="470" fill="#ffffff"/>
  <style>
    .q{fill:#eef4fb;stroke:#1f5fa8;stroke-width:1.5}
    .z{fill:#fff4e5;stroke:#c76b00;stroke-width:1.5}
    .f{fill:#e9f6ec;stroke:#2e7d32;stroke-width:1.5}
    .t{font-size:14px;fill:#1a1a1a}
    .b{font-weight:bold}
    .s{font-size:12.5px;fill:#333}
    .a{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>

  <rect class="q" x="20" y="20" width="400" height="62" rx="8"/>
  <text class="t b" x="36" y="45">1. Hướng dẫn của hãng máy / hãng bơm ghi gì?</text>
  <text class="s" x="36" y="68">Đọc mục dầu thủy lực, danh sách dầu được chấp thuận</text>
  <rect class="f" x="470" y="14" width="270" height="34" rx="6"/>
  <text class="t" x="482" y="36">Ghi "zinc-free" → dầu không kẽm</text>
  <rect class="z" x="470" y="56" width="270" height="34" rx="6"/>
  <text class="t" x="482" y="78">Cấm không kẽm → dầu có kẽm</text>
  <path class="a" d="M420,45 L466,31"/><path class="a" d="M420,58 L466,73"/>
  <path class="a" d="M220,82 L220,118"/>
  <text class="s" x="228" y="105">Không ghi</text>

  <rect class="q" x="20" y="122" width="400" height="62" rx="8"/>
  <text class="t b" x="36" y="147">2. Máy đang chạy dầu gì?</text>
  <text class="s" x="36" y="170">Thêm dầu thì giữ đúng loại đang có trong thùng</text>
  <rect class="z" x="470" y="136" width="270" height="34" rx="6"/>
  <text class="t" x="482" y="158">Đổi loại → xả, súc rửa, thay lọc</text>
  <path class="a" d="M420,153 L466,153"/>
  <path class="a" d="M220,184 L220,220"/>
  <text class="s" x="228" y="207">Thay mới cả thùng</text>

  <rect class="q" x="20" y="224" width="400" height="62" rx="8"/>
  <text class="t b" x="36" y="249">3. Bơm, van có chi tiết đồng, đồng thau?</text>
  <text class="s" x="36" y="272">Hỏi hãng bơm nếu không rõ vật liệu</text>
  <rect class="f" x="470" y="238" width="270" height="34" rx="6"/>
  <text class="t" x="482" y="260">Có → ưu tiên dầu không kẽm</text>
  <path class="a" d="M420,255 L466,255"/>
  <path class="a" d="M220,286 L220,322"/>
  <text class="s" x="228" y="309">Không</text>

  <rect class="q" x="20" y="326" width="400" height="62" rx="8"/>
  <text class="t b" x="36" y="351">4. Dầu hay lẫn nước, hoặc nước thải bị giới hạn kẽm?</text>
  <text class="s" x="36" y="374">Nước làm mát hay lọt vào dầu, nước thải xả ra nguồn chung</text>
  <rect class="f" x="470" y="340" width="270" height="34" rx="6"/>
  <text class="t" x="482" y="362">Có → cân nhắc dầu không kẽm</text>
  <path class="a" d="M420,357 L466,357"/>
  <path class="a" d="M220,388 L220,416"/>

  <rect class="z" x="20" y="420" width="720" height="38" rx="6"/>
  <text class="t b" x="36" y="444">Không → dầu HM/HLP có kẽm (ZDDP) là lựa chọn bình thường, dễ mua, nhiều mã sẵn kho</text>
</svg>
